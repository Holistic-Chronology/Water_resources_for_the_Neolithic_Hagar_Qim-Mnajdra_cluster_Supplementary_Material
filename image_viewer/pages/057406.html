<script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const img = document.getElementById("mainImage");
  const meta = document.getElementById("meta");

  function formatUTCDate(date) {
    return date.toISOString().replace("T", " ").split(".")[0];
  }

  function toDecimal(coord, ref) {
    const [d, m, s] = coord;
    let dec = d + m / 60 + s / 3600;
    return (ref === 'S' || ref === 'W') ? -dec : dec;
  }

  function makeGoogleMapsLink(lat, lon) {
    return `https://maps.google.com/?q=${lat},${lon}`;
  }

  const providedDate = null;
  const providedGPS = null;

  function renderMeta(dateStr, gpsStr) {
    meta.innerHTML = `<strong>Date:</strong> ${dateStr}<br><strong>GPS:</strong> ${gpsStr}`;
  }

  if (providedDate && providedGPS) {
    const gpsStr = `<a href="${makeGoogleMapsLink(providedGPS.lat, providedGPS.lon)}" target="_blank">${providedGPS.lat}, ${providedGPS.lon}</a>`;
    renderMeta(providedDate, gpsStr);
    return;
  }

  function extractFromEXIF() {
    EXIF.getData(img, function () {
      const exifDate = EXIF.getTag(this, 'DateTimeOriginal');
      const gpsTime = EXIF.getTag(this, 'GPSTimeStamp');
      const lat = EXIF.getTag(this, 'GPSLatitude');
      const lon = EXIF.getTag(this, 'GPSLongitude');
      const latRef = EXIF.getTag(this, 'GPSLatitudeRef') || 'N';
      const lonRef = EXIF.getTag(this, 'GPSLongitudeRef') || 'E';

      let gpsStr = "N/A";
      if ((providedGPS || (lat && lon))) {
        const latVal = providedGPS ? providedGPS.lat : toDecimal(lat, latRef).toFixed(6);
        const lonVal = providedGPS ? providedGPS.lon : toDecimal(lon, lonRef).toFixed(6);
        gpsStr = `<a href="${makeGoogleMapsLink(latVal, lonVal)}" target="_blank">${latVal}, ${lonVal}</a>`;
      }

      let dateStr = providedDate || "N/A";
      try {
        if (!providedDate && exifDate) {
          const match = exifDate.match(/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})$/);
          if (match) {
            const [ , y, m, d, , min, sec ] = match;
            const hour = gpsTime && gpsTime[0] != null ? String(Math.floor(gpsTime[0])).padStart(2, '0') : "00";
            const iso = `${y}-${m}-${d}T${hour}:${min}:${sec}Z`;
            const dateObj = new Date(iso);
            if (!isNaN(dateObj)) {
              dateStr = formatUTCDate(dateObj);
            }
          }
        }
      } catch (e) {
        console.warn("EXIF date parsing failed.");
      }

      if (!providedDate && dateStr === "N/A") {
        fetch(img.src, { method: 'HEAD' })
          .then(r => {
            const modified = r.headers.get('Last-Modified');
            if (modified) {
              const d = new Date(modified);
              dateStr = formatUTCDate(d);
            }
            renderMeta(dateStr, gpsStr);
          })
          .catch(() => renderMeta(dateStr, gpsStr));
      } else {
        renderMeta(dateStr, gpsStr);
      }
    });
  }

  if (img.complete) extractFromEXIF();
  else img.onload = extractFromEXIF;
});
</script>
